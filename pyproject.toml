[project]
name = "whose-turn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet==1.0.1",
]
[tool.flet]
org = "com.rjsloane"
product = "Whose Turn?"

[tool.flet.app]
path = "src"

[dependency-groups]
dev = [
    "flet[all]==1.0.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
